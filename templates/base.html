<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{{ title if title else "Bank Dashboard" }}</title>

  <!-- Google font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    :root{
      --accent: #0b57b3;
      --accent-dark: #084a94;
      --muted: #6b7280;
      --bg: #f3f6f9;
      --card: #ffffff;
      --radius: 12px;
    }

    *{box-sizing:border-box}

    body{
      font-family:"Poppins",system-ui,Segoe UI,Roboto,Arial;
      margin:0;
      background:var(--bg);
      color:#222;
    }

    header{
      background:var(--accent);
      color:white;
      padding:25px 20px;
      text-align:center;
      box-shadow:0 6px 18px rgba(10,20,40,0.08);
    }

    header h1{
      margin:0;
      font-weight:600;
      letter-spacing:0.4px;
    }

    nav{
      background:white;
      padding:12px 20px;
      box-shadow:0 4px 10px rgba(0,0,0,0.05);
      display:flex;
      justify-content:center;
      gap:15px;
      flex-wrap:wrap;
    }

    nav a{
      text-decoration:none;
      padding:8px 15px;
      border-radius:8px;
      color:var(--accent);
      font-weight:500;
      transition:0.3s;
    }

    nav a:hover{
      background:#eef6ff;
    }

    .container{
      width:95%;
      max-width:1100px;
      margin:28px auto;
    }

    .card{
      background:var(--card);
      border-radius:var(--radius);
      padding:20px;
      box-shadow:0 6px 18px rgba(15,20,30,0.05);
      margin-bottom:20px;
    }

    table{
      width:100%;
      border-collapse:collapse;
      font-size:14px;
    }

    table th, table td{
      padding:10px 12px;
      border-bottom:1px solid #eef1f6;
      text-align:left;
    }

    table thead th{
      background:#f7f9fc;
      font-weight:600;
    }

    .table-wrap{
      overflow:auto;
      border-radius:8px;
    }

    .btn{
      display:inline-block;
      padding:10px 18px;
      background:var(--accent);
      color:white;
      text-decoration:none;
      border-radius:10px;
      font-weight:600;
      border:none;
      cursor:pointer;
      transition:0.3s;
    }

    .btn:hover{
      background:var(--accent-dark);
    }

    .center{
      text-align:center;
    }

    footer{
      text-align:center;
      padding:20px;
      font-size:13px;
      color:#777;
    }

    @media (max-width:700px){
      nav{
        flex-direction:column;
        align-items:center;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>Bank Transaction Dashboard</h1>
  </header>

  <!-- Navigation Menu -->
  <nav>
    <a href="{{ url_for('index') }}">Home</a>
    <a href="{{ url_for('add_transaction') }}">Add Transaction</a>
    <a href="{{ url_for('transactions') }}">Transactions</a>
    <a href="{{ url_for('summary') }}">Summary</a>
    <a href="{{ url_for('graphs') }}">Graphs</a>
    <a href="{{ url_for('download') }}">Download Report</a>
  </nav>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer>
    © 2025 Banking Transaction Analysis Project | Developed by dilleswari
  </footer>

</body>
</html>
